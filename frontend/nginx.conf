server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;          # required for streaming tokens
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
